# Start: copy .env.example to .env, fill it in, then: docker compose up -d --build
services:
  seres:
    build: .
    image: seres:latest
    container_name: seres
    restart: unless-stopped
    # Shares the network with the server: a Cloudflare tunnel or reverse proxy
    # reaches SereS at localhost:2222, and SereS reaches a mail server on the
    # host at localhost:25. SereS only listens on localhost (HOST and
    # SERES_EXTRA_HOST), so it is not reachable from outside directly.
    network_mode: host
    # Passwords and other settings; .env is never committed.
    env_file: .env
    volumes:
      # The database, including profile pictures and attachments.
      - ./data:/data

  # Backs up the database every BACKUP_DAYS days into ./backups and keeps the
  # newest BACKUP_KEEP backups. Back up right away:
  #   docker compose run --rm backup now
  backup:
    build: deploy/backup
    image: seres-backup:latest
    container_name: seres-backup
    restart: unless-stopped
    # Same user as SereS, so the database files keep their owner.
    user: "1000:1000"
    network_mode: none
    environment:
      BACKUP_DAYS: ${BACKUP_DAYS:-7}
      BACKUP_KEEP: ${BACKUP_KEEP:-4}
    volumes:
      - ./data:/data
      - ./backups:/backups
